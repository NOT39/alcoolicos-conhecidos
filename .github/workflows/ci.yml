name: CI

on:
  pull_request:
    branches: [main, dev]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Run typecheck
        run: bun run typecheck:api

      - name: Run linter
        run: bun run lint:api

      - name: Run tests
        env:
          NODE_ENV: test
          ENABLE_AUTH: "true"
          ENABLE_RATE_LIMITER: "false"
          BETTER_AUTH_SECRET: test-secret-for-ci-32-characters-long!!!
          BETTER_AUTH_URL: http://localhost:3000
        run: bun run test:api
